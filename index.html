<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Su disco de cumpleaños</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<button class="ic snd" id="snd" aria-label="Silenciar sonido" aria-pressed="false"><svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><svg class="of" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg></button>

<!-- PORTADA -->
<section class="scr on" id="cover" aria-label="Portada">
  <p class="hand">para <span class="nom">maestra</span></p>
  <h1 class="big">Feliz <em>cumpleaños</em></h1>
  <p class="kick">Un tributo a Chayanne</p>
  <div class="sw" id="sw">
    <div class="rec" id="rec" role="button" tabindex="0" aria-label="Disco: arrástrelo hacia arriba para abrir"><div class="vin"><div class="lab"><i>TRIBUTO<br>A CHAYANNE</i></div></div></div>
    <svg class="art" viewBox="0 0 300 300" role="img" aria-label="Portada de disco con arcoíris pastel, sol y palmeras">
      <defs>
        <linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ef"/><stop offset=".55" stop-color="#ffd3b8"/><stop offset="1" stop-color="#ffb6d0"/></linearGradient>
        <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="3.5"/></filter>
        <path id="lf" d="M0 0C26-48 78-74 128-70C98-38 56-6 0 0Z"/>
        <clipPath id="cp"><rect width="300" height="236"/></clipPath>
      </defs>
      <rect width="300" height="300" fill="url(#a1)"/>
      <g filter="url(#rough)">
        <circle cx="150" cy="150" r="62" fill="#fff1b8"/>
        <g clip-path="url(#cp)">
          <circle cx="150" cy="236" r="140" fill="#ffb6d0"/><circle cx="150" cy="236" r="118" fill="#ffd3b8"/><circle cx="150" cy="236" r="96" fill="#fff1b8"/><circle cx="150" cy="236" r="74" fill="#c9f3de"/><circle cx="150" cy="236" r="52" fill="#bfe2ff"/><circle cx="150" cy="236" r="30" fill="#d8c9ff"/>
        </g>
        <rect y="236" width="300" height="64" fill="#bfe2ff"/>
        <path d="M0 256q18-9 37 0t37 0 37 0 37 0 37 0 37 0 38 0M0 280q18-9 37 0t37 0 37 0 37 0 37 0 37 0 38 0" fill="none" stroke="#fffaf4" stroke-width="3.5" stroke-linecap="round"/>
        <g fill="#9fdcc0"><use href="#lf" transform="translate(0 300) rotate(-14) scale(.9)"/><use href="#lf" transform="translate(0 300) rotate(-46) scale(.9)"/><use href="#lf" transform="translate(0 300) rotate(-76) scale(.8)"/>
        <use href="#lf" transform="translate(300 300) scale(-1 1) rotate(-14) scale(.9)"/><use href="#lf" transform="translate(300 300) scale(-1 1) rotate(-46) scale(.9)"/><use href="#lf" transform="translate(300 300) scale(-1 1) rotate(-76) scale(.8)"/></g>
      </g>
      <g fill="#fffaf4"><path d="M44 62l4 10 10 4-10 4-4 10-4-10-10-4 10-4z"/><path d="M252 48l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><path d="M232 112l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/></g>
      <path d="M262 150c-6-9 4-15 8-8 4-7 14-1 8 8l-8 8z" fill="#ff8fb8" transform="translate(-232 -80) scale(.9)"/>
      <text x="150" y="38" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-style="italic" font-weight="700" font-size="25" fill="#4a3f63">Tributo a Chayanne</text>
      <text id="cvNom" x="150" y="226" text-anchor="middle" font-family="Caveat,cursive" font-weight="600" font-size="30" fill="#4a3f63">maestra</text>
    </svg>
  </div>
  <p class="hint" id="hint">Deslice el disco hacia arriba <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></p>
  <button class="btn" id="abrir">Abrir el disco</button>
</section>

<!-- REPRODUCTOR -->
<section class="scr" id="player" aria-label="Tocadiscos">
  <div class="ph"><p class="hand">su disco de cumpleaños</p><h2 class="ttl">Noche <em>Chayanne</em></h2></div>
  <div class="deck" id="deck">
    <div class="vin" id="vin" role="img" aria-label="Disco de vinilo. Arrástrelo para hacerlo girar"><div class="lab"><i><span class="nom">maestra</span></i></div></div>
    <div class="pivot"></div>
    <div class="arm" id="arm" role="button" tabindex="0" aria-label="Aguja del tocadiscos: arrástrela sobre el disco o tóquela para reproducir"></div>
  </div>
  <p class="np" id="np" role="status">Ponga la aguja sobre el disco</p>
  <div class="eq" id="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="flw" id="flw" aria-hidden="true"></div>
  <p class="prog" id="prog" role="status"></p>
  <div class="bubs" id="bubs"></div>
</section>

<!-- HOJA -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT">
  <header><button class="ic" id="cerrar" aria-label="Volver al disco"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2 id="shT" class="fr"></h2></header>
  <div id="shB"></div>
</div>

<script src="app.js"></script>
</body>
</html>
